# Docker's embedded DNS returns every replica of "api"; the variable forces nginx to
# re-resolve so `docker compose up --scale api=N` is picked up without a restart.
resolver 127.0.0.11 valid=5s ipv6=off;
server {
  listen 80;
  client_max_body_size 200m;
  location / {
    set $upstream http://api:8000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }
}
